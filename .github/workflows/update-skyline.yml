name: Update contribution skyline

on:
  workflow_dispatch:
  schedule:
    - cron: "17 6 * * *"

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Render SVGs
        env:
          # e.g. "github:octocat forgejo:https://codeberg.org/octocat"
          SOURCES: ${{ vars.SOURCES || format('github:{0}', github.repository_owner) }}
          THEME: ${{ vars.THEME || 'github' }}
          TZ_NAME: ${{ vars.TZ_NAME || 'UTC' }}
          DISPLAY_NAME: ${{ vars.DISPLAY_NAME }}
          GH_README_TOKEN: ${{ secrets.GH_README_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FORGEJO_TOKEN: ${{ secrets.FORGEJO_TOKEN }}
        run: python generate.py --out output

      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add output/*.svg
          git diff --cached --quiet && exit 0
          git commit -m "chore: update contribution skyline"
          git push
